plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.mydeliveryrover"
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    signingConfigs {
        release {
            keyAlias 'my-key-alias'
            keyPassword 'qwerty12345' // Пароль для ключа
            storeFile file('my-release-key.jks')
            storePassword 'qwerty12345' // Пароль для keystore
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release // Подключаем конфигурацию подписи
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.example.mydeliveryrover"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion

        // Устанавливаем версии прямо в build.gradle
        versionCode 2
        versionName "1.1"
    }
}

flutter {
    source '../..'
}

dependencies {}
